name: Elpriser
options:
  bundleIdPrefix: org.elpriser
  # English is the development language: the String Catalog's source language and the fallback for languages the app lacks.
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 356K9LKCC6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "7"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Elpriser:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        # Generated bookkeeping of the i18n build, not an app resource.
        excludes:
          - localizations.json
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Elpriser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIAppFonts:
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The base (English) text; the 29 translations come from Resources/InfoPlist.xcstrings.
        NSLocationWhenInUseUsageDescription: "Elpriser uses your position once, when you tap “Use my position”, to find your grid company. The position is never stored — only the name of the grid company."
        # The same list as Resources/localizations.json (generated by scripts/i18n/build.mjs; test-i18n.mjs checks it).
        CFBundleLocalizations:
          - da
          - en
          - de
          - fr
          - nl
          - it
          - pl
          - sv
          - nb
          - nn
          - "no"  # quoted: a bare no is a YAML boolean
          - fi
          - cs
          - hu
          - sl
          - es
          - pt
          - sk
          - el
          - ro
          - bg
          - hr
          - sr
          - sr-Latn
          - et
          - lv
          - lt
          - mk
          - sq
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elpriser.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  ElpriserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Elpriser
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.elpriser.app.tests
        DEVELOPMENT_TEAM: 356K9LKCC6
schemes:
  Elpriser:
    build:
      targets:
        Elpriser: all
        ElpriserTests: [test]
    test:
      targets:
        - ElpriserTests
